<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title or "FitBuddy" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
<header class="site-header">
  <div class="brand">
    <span class="brand-mark">FB</span>
    <div><h1>FitBuddy</h1><p>AI Fitness Plan Generator</p></div>
  </div>
  <nav><a href="/">Home</a><a href="/admin">Admin</a><a href="/docs">API Docs</a></nav>
</header>
<main class="container">
  {% if message %}<div class="alert success">{{ message }}</div>{% endif %}
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
<footer>FitBuddy is a general wellness demo for adults (18+), not medical advice.</footer>
</body>
</html>
